name: Release resource packs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Work from the exact repository state being released
      - name: Check out repository
        uses: actions/checkout@v6

      # Build every root-level directory that looks like a resource pack
      - name: Build resource packs
        shell: bash
        run: |
          mkdir dist
          FOUND=0

          for PACK in */; do
            PACK="${PACK%/}"

            if [ ! -f "$PACK/pack.mcmeta" ]; then
              continue
            fi

            FOUND=1
            NAME="HP-$PACK"
            ZIP="dist/$NAME.zip"

            echo "Building $NAME"

            # Fail early if the pack metadata is invalid JSON
            jq empty "$PACK/pack.mcmeta"

            (
              cd "$PACK"
              zip -r "../$ZIP" . -x "*.DS_Store"
            )

            # Keep the hash separate so it can be copied into server.properties
            sha1sum "$ZIP" | cut -d " " -f 1 > "$ZIP.sha1"
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No resource packs found"
            exit 1
          fi

      # Put the hashes directly in the release notes for easy copying
      - name: Create release notes
        shell: bash
        run: |
          {
            echo "## Resource pack SHA-1 hashes"
            echo

            for HASH_FILE in dist/*.sha1; do
              PACK="$(basename "$HASH_FILE" .zip.sha1)"
              HASH="$(cat "$HASH_FILE")"

              echo "- **$PACK**: \`$HASH\`"
            done
          } > release-notes.md

      # One release contains every pack so /releases/latest remains stable
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "resource-packs-v${{ inputs.version }}" \
            dist/* \
            --target "${{ github.sha }}" \
            --title "Horizon Peaks Resource Packs v${{ inputs.version }}" \
            --notes-file release-notes.md \
            --latest
