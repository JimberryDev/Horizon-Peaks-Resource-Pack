name: Validate resource pack

on:
  pull_request:
    branches:
      - main
    paths:
      - "main/**"
      - ".github/workflows/validate-resource-pack.yaml"

permissions:
  contents: read

jobs:
  validate-resource-pack:
    name: Validate resource pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged PR
        uses: actions/checkout@v6

      - name: Validate resource pack
        uses: MrKinau/ResourcePackValidator@v2
        with:
          resourcepack: main